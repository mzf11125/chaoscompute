name: chaoscompute
subdomain: chaoscompute
title: 'ChaosCompute — Decentralized AI Inference'
description: 'OpenAI-compatible AI inference with pay.sh HTTP 402 payments on Solana. Provider cost + 5% margin. Revenue funds Phase 2 decentralized compute.'
category: ai_ml
version: v1

routing:
  type: proxy
  url: https://api.openai.com

env:
  UPSTREAM_API_KEY: ${UPSTREAM_API_KEY:-}

operator:
  currencies:
    usd: ['USDC']
  network: localnet
  fee_payer: true

free_tier:
  unit: tokens
  scale: 1000000
  budget: 1

endpoints:
  - method: GET
    path: 'v1/health'
    description: 'Gateway health check. Free.'

  - method: GET
    path: 'v1/models'
    description: 'List available AI models from all 20+ supported providers. Free.'

  - method: POST
    path: 'v1/chat/completions'
    description: 'OpenAI-compatible chat completions. Dynamic per-provider pricing: provider cost + 5% gateway margin. Revenue funds the Phase 2 decentralized compute treasury.'
    metering:
      dimensions:
        - direction: input
          unit: tokens
          scale: 1000000
          tiers:
            - price_usd: 3.00
        - direction: output
          unit: tokens
          scale: 1000000
          tiers:
            - price_usd: 12.00
    session:
      ttl_seconds: 300

  - method: GET
    path: 'v1/spend'
    description: 'Wallet spend summary with per-provider cost breakdown. Free.'

  - method: GET
    path: 'v1/providers'
    description: 'List 20+ supported AI providers, models, and per-provider pricing. Free.'

notes: |
  **30 providers across 3 tiers. 5% margin on all paid models. Free tier included.**

  Tier 1 — Premium ($1.25-$3.00/1M): OpenAI (gpt-4o), Anthropic (claude-sonnet-4), Gemini, xAI Grok, Mistral
  Tier 2 — Cheap ($0.01-$0.88/1M): Nscale ($0.01), DeepSeek ($0.14), Hyperbolic, Fireworks, DeepInfra, Together, OpenRouter
  Tier 3 — Free ($0/1M): Groq, Cerebras, SambaNova, Nebius, Featherless

  First 1M tokens/month free across all tiers. After that, provider cost + 5% margin.
  100% of revenue funds the Phase 2 decentralized compute treasury.
  Governance: Open source, MIT, sole maintainer mzf11125. See GOVERNANCE.md.
