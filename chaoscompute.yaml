name: chaoscompute
subdomain: chaoscompute
title: 'ChaosCompute — Decentralized AI Inference'
description: 'Drop-in OpenAI-compatible AI inference API with pay.sh wallet-approved HTTP 402 payments on Solana.'
category: ai_ml
version: v1

routing:
  type: proxy
  url: https://api.openai.com

env:
  UPSTREAM_API_KEY: ${UPSTREAM_API_KEY:-}

operator:
  currencies:
    usd: ['USDC']
  network: localnet
  fee_payer: true

endpoints:
  - method: GET
    path: 'v1/health'
    description: 'Gateway health check. Free.'

  - method: GET
    path: 'v1/models'
    description: 'List available AI models from all supported providers. Free.'

  - method: POST
    path: 'v1/chat/completions'
    description: 'OpenAI-compatible chat completions routed to the best available provider. Per-token metering via HTTP 402.'
    metering:
      dimensions:
        - direction: input
          unit: tokens
          scale: 1000000
          tiers:
            - price_usd: 0.50
        - direction: output
          unit: tokens
          scale: 1000000
          tiers:
            - price_usd: 1.50
    session:
      ttl_seconds: 300

  - method: GET
    path: 'v1/spend'
    description: 'Wallet spend summary. Free.'

  - method: GET
    path: 'v1/providers'
    description: 'List supported AI providers and their models. Free.'

notes: |
  **ChaosCompute** is a decentralized AI inference gateway powered by CLIProxyAPI routing
  and pay.sh HTTP 402 payments on Solana. Drop-in OpenAI compatibility with 20+ upstream
  providers including OpenAI, Anthropic, Google Gemini, xAI, Kimi, DeepSeek, GLM, and more.

  `pay curl https://gateway.chaoscompute.io/v1/chat/completions`
