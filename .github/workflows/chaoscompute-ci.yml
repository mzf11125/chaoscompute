name: ChaosCompute

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: write

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    outputs:
      cache_key: ${{ steps.cache-restore.outputs.cache-primary-key }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r lint

  test:
    runs-on: ubuntu-latest
    needs: [lint-typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r test

  build:
    runs-on: ubuntu-latest
    needs: [lint-typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter gateway build
      - uses: actions/upload-artifact@v4
        with:
          name: gateway-dist
          path: packages/gateway/dist/
          retention-days: 7

  anchor-test:
    runs-on: ubuntu-latest
    needs: [lint-typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: metadaoproject/setup-anchor@v2
        with:
          anchor-version: '0.30.1'
          solana-cli-version: '2.0.23'
          node-version: '22'
      - run: |
          cd programs/chaos_compute
          anchor test

  docker:
    needs: [build, test]
    uses: ./.github/workflows/docker.yml
    secrets: inherit

  auto-merge:
    if: github.event_name == 'pull_request' && success()
    needs: [build, test, anchor-test]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: hmarr/auto-approve-action@v4
      - uses: pascalgn/automerge-action@v0.16
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_LABELS: 'automerge'
          MERGE_RETRY_SLEEP: 30000
